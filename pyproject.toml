[project]
name = "enigma-simulator"
version = "0.1.0"
description = "A simulation of the Enigma machine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["License"]
authors = [
    {name = "Filip Rzepkowski", email = "0120629@pw.edu.pl"},
]
dependencies = [
    "pyside6>=6.10.1",
]

[project.urls]
Repository = "https://github.com/rzep1x/enigma-simulator"

[project.scripts]
enigma = "enigma.main:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enigma*"]

[tool.setuptools.package-data]
enigma = ["gui/*.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=enigma --cov-report=term-missing"

[tool.coverage.run]
omit = ["enigma/gui/*"]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["enigma/gui/ui_enigma.py"]

[tool.ruff.lint]
select = [
    "E",   # błędy stylu (pycodestyle)
    "W",   # ostrzeżenia stylu (pycodestyle)
    "F",   # prawdziwe błędy: nieużyte importy, niezdefiniowane nazwy (pyflakes)
    "I",   # kolejność importów (isort)
    "B",   # typowe pułapki i bugi (flake8-bugbear)
    "UP",  # przestarzała składnia, którą da się zapisać nowocześniej (pyupgrade)
]
